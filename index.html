<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TBK - V114 Reset strict conseillé</title>
  <link rel="stylesheet" href="css/tbk-reset-v114.css">
</head>
<body>
  <main>
    <h1>TBK - V114 Reset strict conseillé</h1>

    <p>
      Cette page est un exemple d'intégration du reset strict. Dans le site TBK réel,
      il faut reprendre les scripts et le bouton ci-dessous dans ton interface existante.
    </p>

    <div id="tournament-message" class="tournament-message"></div>

    <section>
      <h2>Administration tournoi</h2>
      <button class="tbk-danger-button" onclick="tbkResetTournamentFullV114()">
        Réinitialiser complètement le tournoi
      </button>
    </section>

    <section>
      <h2>Actions manuelles</h2>
      <button onclick="generateGroups({ source: 'manual' })">Générer les poules</button>
      <button onclick="generateMatches({ source: 'manual' })">Générer les matchs</button>
      <button onclick="generateSchedule({ source: 'manual' })">Générer le planning</button>
    </section>
  </main>

  <!-- Dans le site réel, Supabase doit déjà être initialisé avant ces scripts. -->
  <script src="js/tbk-config.js"></script>
  <script src="js/tbk-generation-guards-v114.js"></script>
  <script src="js/tbk-reset-strict-v114.js"></script>
</body>
</html>
